apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  namespace: todoapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox
            command: 
            - /bin/sh
            - -c 
            - date; echo hello from kubernetes cluster
          restartPolicy: OnFailure